[package]
name = "kiln-app"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[[bin]]
name = "kiln"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.30.2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.30.2", features = ["font-kit", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["gif", "ico", "jpeg", "png", "webp"] }
lucide-icons = "=1.80.0"
pulldown-cmark = { version = "0.13", default-features = false }
resvg = { version = "0.49", default-features = false }
tree-sitter-bash = "0.25"
tree-sitter-highlight = "0.26"
unicode-segmentation = "1"
kiln-core = { path = "../kiln-core" }
kiln-agent = { path = "../kiln-agent" }
